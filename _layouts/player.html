---
layout: side_by_side
---

<div class="phb">
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <h1>{{ page.title }}</h1>
            </div>
        </div>
        {% if page.characters %}
        <div class="row">
            <div class="col-12">
                <h3>Characters</h3>
                <ul>
                    {% for character_slug in page.characters %}
                    <li><a href="/characters/{{ character_slug }}">{{ character_slug | replace: '-', ' ' | split: ' ' | map: 'capitalize' | join: ' ' }}</a></li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        {% endif %}
        <div class="row">
            {{ content }}
        </div>
    </div>
</div>
