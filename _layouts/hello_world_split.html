<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello Split</title>
  <style>
    html,body{height:100%;margin:0}
    .split{display:flex;height:100vh;width:100%;}
    .left{flex:2;display:flex;align-items:center;justify-content:center;background:#f8f0e3;font-size:2rem}
    .right{flex:1;display:flex;align-items:center;justify-content:center;background:#e9e9e9;font-size:2rem}
  </style>
</head>
<body>
  <div class="split">
    <div class="left">Hello 2/3</div>
    <div class="right">Hello 1/3</div>
  </div>
</body>
</html>
