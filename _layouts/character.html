---
layout: side_by_side
---

<div class="phb">
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <h1>{{ page.title }}</h1>
                <p>{{ page.race }} {{ page.class }} &middot; Level {{ page.level }}</p>
                {% if page.player %}
                <p><em>Played by <a href="/players/{{ page.player | slugify }}">{{ page.player }}</a></em></p>
                {% endif %}
            </div>
        </div>
        <div class="row">
            {{ content }}
        </div>
    </div>
</div>
